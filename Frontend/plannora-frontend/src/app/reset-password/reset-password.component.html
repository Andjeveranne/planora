<div class="login-container">
    <div class="login-left">
        <img src="FemmeManager.jpeg" alt="Plannora" class="login-image">
    </div>

    <div class="login-right">
        <div class="login-content">
            <div class="logo-container">
                <img src="Planora.png" alt="Plannora Logo" class="logo">
            </div>

            <h1 class="title">Réinitialisation</h1>
            <p class="subtitle">Créez votre nouveau mot de passe</p>

            <div *ngIf="successMessage" class="alert alert-success">
                {{ successMessage }}
                <p>Redirection vers la connexion...</p>
            </div>

            <div *ngIf="errorMessage" class="alert alert-error">
                {{ errorMessage }}
            </div>

            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="login-form" *ngIf="!successMessage && token">
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" formControlName="newPassword" placeholder="Nouveau mot de passe"
                            class="form-input">
                        <span class="input-icon">🔒</span>
                    </div>
                    <div *ngIf="resetForm.get('newPassword')?.touched && resetForm.get('newPassword')?.invalid"
                        class="error-message">
                        <small *ngIf="resetForm.get('newPassword')?.errors?.['required']">Requis</small>
                        <small *ngIf="resetForm.get('newPassword')?.errors?.['minlength']">Min 6 caractères</small>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" formControlName="confirmPassword" placeholder="Confirmer mot de passe"
                            class="form-input">
                        <span class="input-icon">🔒</span>
                    </div>
                    <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched"
                        class="error-message">
                        <small>Les mots de passe ne correspondent pas</small>
                    </div>
                </div>

                <button type="submit" class="btn-submit" [disabled]="resetForm.invalid || isLoading">
                    <span *ngIf="!isLoading">Valider</span>
                    <span *ngIf="isLoading">Traitement...</span>
                </button>
            </form>

            <div class="forgot-password" style="text-align: center; margin-top: 20px;">
                <a routerLink="/login" class="link">Retour à la connexion</a>
            </div>
        </div>
    </div>
</div>
