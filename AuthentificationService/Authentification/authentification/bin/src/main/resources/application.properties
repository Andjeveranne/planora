spring.application.name=authentification-service
server.port=8085

# Base de données
spring.datasource.url=jdbc:mysql://localhost:3306/PlannoraDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# JWT
# Expiraiton du token estimé à 24h
jwt.secret=${JWT_SECRET:change-this-development-secret}
jwt.expiration=86400000 

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.isi4.authentification=DEBUG

# Configuration Email (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=russel.vsx@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
